# ============================================================
# MODEL CONFIGURATIONS — 10 MODELS (5 Causal + 5 Encoder)
# CRITICAL: All models use 16-bit precision for uniformity.
# Most models use float16; gemma-3-4b-it, gpt-oss-20b, and
# sarvam-2b use bfloat16 (both 16-bit) per design constraints.
# See [5] Hu et al. (2022) for LoRA methodology.
# ============================================================

causal_models:
  qwen2.5-1.5b:
    hf_id: "Qwen/Qwen2.5-1.5B-Instruct"
    family: "Alibaba/Qwen"
    params: "1.5B"
    dtype: "float16"
    model_type: "causal"
    languages: ["en", "hi", "bn"]
    lora:
      r: 16
      lora_alpha: 32
      lora_dropout: 0.05
      target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
      task_type: "CAUSAL_LM"

  gemma-3-4b-it:
    hf_id: "google/gemma-3-4b-it"
    family: "Google/Gemma"
    params: "4B"
    dtype: "bfloat16"  # Gemma 3 NaNs in float16; bfloat16 is still 16-bit
    model_type: "causal"
    languages: ["en", "hi", "bn"]
    lora:
      r: 16
      lora_alpha: 32
      lora_dropout: 0.05
      target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
      task_type: "CAUSAL_LM"

  llama-3.1-8b:
    hf_id: "meta-llama/Llama-3.1-8B-Instruct"
    family: "Meta/Llama"
    params: "8B"
    dtype: "float16"
    model_type: "causal"
    languages: ["en", "hi", "bn"]
    lora:
      r: 16
      lora_alpha: 32
      lora_dropout: 0.05
      target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
      task_type: "CAUSAL_LM"

  gpt-oss-20b:
    hf_id: "openai/gpt-oss-20b"
    family: "OpenAI/GPT-OSS"
    params: "21B"  # 21B total, 3.6B active (MoE: 32 experts, 4 active)
    dtype: "bfloat16"
    model_type: "causal"
    languages: ["en", "hi", "bn"]
    lora:
      r: 16
      lora_alpha: 32
      lora_dropout: 0.05
      target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
      task_type: "CAUSAL_LM"

  sarvam-2b:
    hf_id: "sarvamai/sarvam-2b-v0.5"
    family: "Sarvam/Sarvam"
    params: "2B"
    dtype: "bfloat16"
    model_type: "causal"
    languages: ["en", "hi", "bn"]
    lora:
      r: 16
      lora_alpha: 32
      lora_dropout: 0.05
      target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
      task_type: "CAUSAL_LM"

encoder_models:
  mbert:
    hf_id: "bert-base-multilingual-cased"
    family: "Google/BERT"
    params: "178M"
    dtype: "float16"
    model_type: "encoder"
    languages: ["en", "hi", "bn"]
    lora:
      r: 16
      lora_alpha: 32
      lora_dropout: 0.05
      target_modules: ["query", "value", "key"]
      task_type: "MASKED_LM"

  xlm-roberta:
    hf_id: "xlm-roberta-base"
    family: "Meta/XLM-RoBERTa"
    params: "278M"
    dtype: "float16"
    model_type: "encoder"
    languages: ["en", "hi", "bn"]
    lora:
      r: 16
      lora_alpha: 32
      lora_dropout: 0.05
      target_modules: ["query", "value", "key"]
      task_type: "MASKED_LM"

  muril:
    hf_id: "google/muril-base-cased"
    family: "Google/MuRIL"
    params: "236M"
    dtype: "float16"
    model_type: "encoder"
    languages: ["en", "hi", "bn"]
    lora:
      r: 16
      lora_alpha: 32
      lora_dropout: 0.05
      target_modules: ["query", "value", "key"]
      task_type: "MASKED_LM"

  indicbert-v2:
    hf_id: "ai4bharat/IndicBERTv2-MLM-only"
    family: "AI4Bharat/IndicBERT"
    params: "278M"
    dtype: "float16"
    model_type: "encoder"
    languages: ["en", "hi", "bn"]
    lora:
      r: 16
      lora_alpha: 32
      lora_dropout: 0.05
      target_modules: ["query", "value", "key"]
      task_type: "MASKED_LM"

  jhu-clsp-mmbert:
    hf_id: "jhu-clsp/mmBERT-base"
    family: "JHU-CLSP/mmBERT"
    params: "307M"  # 22 layers, ModernBERT arch, 1800+ languages
    dtype: "float16"
    model_type: "encoder"
    languages: ["en", "hi", "bn"]
    lora:
      r: 16
      lora_alpha: 32
      lora_dropout: 0.05
      target_modules: ["Wqkv"]
      task_type: "MASKED_LM"
